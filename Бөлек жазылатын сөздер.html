<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Rule Hunter: Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: linear-gradient(135deg, #F3FBFF 0%, #E9E2FF 50%, #D9F1FF 100%); font-family: 'Nunito', sans-serif; overflow: hidden; color: #1e3a8a; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05); }
        .card { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; user-select: none; border-radius: 20px; }
        .card:hover { transform: scale(1.06); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3); }
        .ripple { position: absolute; border-radius: 50%; transform: scale(0); animation: ripple-effect 0.6s linear; background: rgba(56, 189, 248, 0.3); }
        @keyframes ripple-effect { to { transform: scale(4); opacity: 0; } }
        .glow-success { animation: success-burst 0.8s ease-out forwards; }
        @keyframes success-burst { 0% { transform: scale(1); background: #22c55e !important; color: white; } 100% { transform: scale(1); background: #22c55e; color: white; } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center">

    <canvas id="bgCanvas"></canvas>

    <div id="hud" class="hidden w-full p-6 flex justify-between items-center z-50">
        <div class="glass px-6 py-2 rounded-full flex gap-6 text-lg font-bold text-blue-900">
            <span>⭐ XP: <b id="xp">0</b></span>
            <span>🏆 Score: <b id="score">0</b></span>
            <span>🔥 Combo: <b id="combo">0</b></span>
        </div>
        <div class="glass px-6 py-2 rounded-full font-bold text-blue-900 text-lg">Level: <b id="level">1</b>/6</div>
    </div>

    <div id="rule-card" class="hidden glass w-11/12 max-w-2xl mt-4 p-8 rounded-3xl text-center z-40">
        <h2 class="text-blue-500 font-bold tracking-widest text-sm uppercase">📖 ЕРЕЖЕ</h2>
        <p id="rule-text" class="text-2xl font-black mt-2 text-blue-900"></p>
        <div id="target-word" class="mt-6 text-4xl font-black text-blue-800 p-4 rounded-xl border-4 border-blue-200 inline-block bg-white/50 shadow-inner">?</div>
    </div>

    <div id="game-area" class="flex-grow w-full relative z-20 flex flex-wrap justify-center items-center gap-6 p-10">
        <div id="cards-container" class="flex flex-wrap justify-center gap-6"></div>
    </div>

    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-[#F3FBFF]">
        <h1 class="text-6xl font-black text-blue-900 drop-shadow-md">RULE HUNTER</h1>
        <p class="text-xl mt-4 text-blue-700">Авторы: umittoibaeva</p>
        <button id="start-btn" class="mt-10 px-12 py-5 bg-blue-500 hover:bg-blue-600 text-white rounded-full font-bold text-xl shadow-lg transition hover:scale-105">▶️ ОЙЫНДЫ БАСТАУ</button>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.size = Math.random()*5+2; this.speedX = Math.random()*0.5-0.25; this.speedY = Math.random()*0.5-0.25; this.alpha = Math.random()*0.3; }
            update() { this.x += this.speedX; this.y += this.speedY; if(this.x<0 || this.x>canvas.width || this.y<0 || this.y>canvas.height) this.reset(); }
            draw() { ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
        }
        for(let i=0; i<80; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0,0,canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();

        const levels = [
            { rules: "Күрделі атаулар бөлек жазылады.", pairs: [["Қазақстан", "Республикасы"], ["Президент", "Әкімшілігі"], ["Ұлттық", "музей"]], distractors: ["Республика", "Әкімшілік", "Музей"] },
            { rules: "Күрделі сан есімдер бөлек жазылады.", pairs: [["он", "бір"], ["жүз", "елу"], ["мың", "тоғыз жүз"]], distractors: ["бірлік", "елулік", "жүздік"] },
            { rules: "Етістік тіркестері бөлек жазылады.", pairs: [["ән", "салу"], ["оқып", "отыр"], ["ойнап", "жүр"]], distractors: ["ойнау", "оқып", "әнші"] },
            { rules: "Еш, әр, кей, бір, қай, әлде бөлек жазылады.", pairs: [["еш", "адам"], ["әр", "бала"], ["бір", "жұмыс"]], distractors: ["балалық", "адамзат", "жұмысшы"] },
            { rules: "Тұрақты тіркестер бөлек жазылады.", pairs: [["бас", "тарту"], ["қол ұшын", "беру"], ["ат", "қою"]], distractors: ["басшы", "қолғап", "аттан"] },
            { rules: "Екі зат есім бөлек жазылады.", pairs: [["ағаш", "тарақ"], ["ат", "қора"], ["бас", "сүйек"]], distractors: ["ағаштан", "атпен", "басқа"] }
        ];

        let state = { level: 0, pairIdx: 0, score: 0, xp: 0, combo: 0 };
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(type === 'correct' ? 880 : 150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function checkMatch(el, selected, correct) {
            if(selected === correct) {
                playSound('correct'); el.classList.add('glow-success');
                state.score += 100; state.xp += 50; state.combo++;
                document.getElementById('score').textContent = state.score;
                document.getElementById('xp').textContent = state.xp;
                document.getElementById('combo').textContent = state.combo;
                setTimeout(() => { state.pairIdx++; if(state.pairIdx < levels[state.level].pairs.length) showChallenge(); else { state.level++; state.combo = 0; initLevel(); } }, 1000);
            } else {
                playSound('wrong'); state.combo = 0; document.getElementById('combo').textContent = state.combo;
                el.style.background = '#fca5a5'; setTimeout(() => el.style.background = '', 500);
            }
        }

        function showChallenge() {
            const data = levels[state.level]; const pair = data.pairs[state.pairIdx];
            document.getElementById('target-word').textContent = pair[0] + " + ...";
            const cont = document.getElementById('cards-container'); cont.innerHTML = '';
            [pair[1], ...data.distractors.slice(0,3)].sort(()=>Math.random()-0.5).forEach(txt => {
                const el = document.createElement('div');
                el.className = 'card glass px-8 py-4 text-xl font-bold border border-blue-200 text-blue-900';
                el.textContent = txt;
                el.onclick = (e) => { const r = document.createElement('div'); r.className = 'ripple'; r.style.left = (e.clientX - el.offsetLeft) + 'px'; r.style.top = (e.clientY - el.offsetTop) + 'px'; el.appendChild(r); checkMatch(el, txt, pair[1]); };
                cont.appendChild(el);
            });
        }

        function initLevel() {
            if(state.level >= levels.length) {
                document.getElementById('rule-card').innerHTML = '<h1 class="text-5xl font-black text-blue-900">🏆 RULE HUNTER MASTER!</h1>';
                document.getElementById('cards-container').innerHTML = '<button onclick="location.reload()" class="px-10 py-5 bg-blue-500 text-white rounded-full font-bold text-xl hover:scale-105 transition">🔄 Қайта бастау</button>';
                return;
            }
            document.getElementById('rule-text').textContent = levels[state.level].rules;
            document.getElementById('level').textContent = state.level + 1;
            state.pairIdx = 0; showChallenge();
        }

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('rule-card').classList.remove('hidden');
            initLevel();
        };
    </script>
</body>
</html>
