<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тура және Ауыспалы мағына - Неон Ойыны</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0221;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Неон тақырыбы */
        h1 {
            font-size: 2.5rem;
            color: #00f3ff;
            text-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #00a8ff;
            text-align: center;
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 1.5rem;
            color: #ffe600;
            text-shadow: 0 0 5px #ffe600, 0 0 10px #ffe600;
            margin-bottom: 20px;
        }

        /* Басқару батырмалары */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: transparent;
            color: #ff007f;
            border: 2px solid #ff007f;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff007f;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f;
            transform: scale(1.05);
        }

        .btn:disabled {
            border-color: #555;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Ойын алаңы */
        .game-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .column {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .column-title {
            text-align: center;
            font-size: 1.3rem;
            color: #bf00ff;
            text-shadow: 0 0 8px #bf00ff;
            margin-bottom: 10px;
        }

        /* Неон карточкалар */
        .card {
            background: rgba(13, 2, 33, 0.8);
            border: 2px solid #00f3ff;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 0 8px #00f3ff;
            transition: all 0.2s ease;
            user-select: none;
        }

        .card:hover {
            box-shadow: 0 0 15px #00f3ff, 0 0 25px #00f3ff;
            transform: translateY(-2px);
        }

        /* Таңдалған карточка */
        .card.selected {
            border-color: #ffe600;
            box-shadow: 0 0 15px #ffe600, 0 0 30px #ffe600;
            background: rgba(255, 230, 0, 0.2);
        }

        /* Дұрыс тапқанда */
        .card.matched {
            border-color: #00ff66;
            box-shadow: 0 0 15px #00ff66;
            background: rgba(0, 255, 102, 0.1);
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }

        /* Жекені сақтау диалогы (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 2, 33, 0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: #0d0221;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px #00ff66;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
        }

        .modal-title {
            color: #00ff66;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #00ff66;
            margin-bottom: 15px;
        }

        .modal-body {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Автор жазуы */
        footer {
            margin-top: auto;
            padding: 15px;
            font-size: 1.2rem;
            color: #00f3ff;
            text-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff;
            letter-spacing: 1.5px;
        }

        @media (max-width: 600px) {
            .game-container {
                flex-direction: column;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <h1>Тура және Ауыспалы мағына</h1>
    
    <div class="score-board">
        Ұпай: <span id="score">0</span> / 60
    </div>

    <div class="controls">
        <button class="btn" id="startBtn" onclick="startGame()">Бастау</button>
        <button class="btn" id="undoBtn" onclick="undoMove()" disabled>Кері қайту</button>
        <button class="btn" id="restartBtn" onclick="restartGame()">Қайта ойнау</button>
    </div>

    <div class="game-container">
        <!-- Сол жақ: Сөз тіркестері -->
        <div class="column" id="phrasesCol">
            <div class="column-title">Сөз тіркестері</div>
        </div>

        <!-- Оң жақ: Мағына түрлері -->
        <div class="column" id="typesCol">
            <div class="column-title">Мағына түрі</div>
        </div>
    </div>

    <!-- Жеңіс хабарламасы заманауи модаль терезесінде -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <div class="modal-title">Құттықтаймыз! 🎉</div>
            <div class="modal-body">Сіз барлық сөздердің мағынасын дұрыс таптыңыз!</div>
            <button class="btn" onclick="closeModal()">Жабу</button>
        </div>
    </div>

    <footer>
        Автор: Ү.Тойбаева
    </footer>

    <script>
        // Ойын деректері
        const gameData = [
            { id: 1, text: "Алтын сағат", type: "Тура мағына" },
            { id: 2, text: "Алтын адам", type: "Ауыспалы мағына" },
            { id: 3, text: "Тәтті алма", type: "Тура мағына" },
            { id: 4, text: "Тәтті ұйқы", type: "Ауыспалы мағына" },
            { id: 5, text: "Суық су", type: "Тура мағына" },
            { id: 6, text: "Суық хабар", type: "Ауыспалы мағына" }
        ];

        let selectedPhrase = null;
        let selectedType = null;
        let score = 0;
        let gameActive = false;
        let history = []; 

        // Web Audio API дыбыстары
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function shuffle(array) {
            return [...array].sort(() => Math.random() - 0.5);
        }

        function startGame() {
            playSound('click');
            gameActive = true;
            score = 0;
            history = [];
            selectedPhrase = null;
            selectedType = null;
            document.getElementById('score').innerText = score;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('undoBtn').disabled = true;

            renderCards();
        }

        function renderCards() {
            const phrasesCol = document.getElementById('phrasesCol');
            const typesCol = document.getElementById('typesCol');

            phrasesCol.innerHTML = '<div class="column-title">Сөз тіркестері</div>';
            typesCol.innerHTML = '<div class="column-title">Мағына түрі</div>';

            const shuffledPhrases = shuffle(gameData);
            let typesList = gameData.map(item => ({ id: item.id, type: item.type }));
            typesList = shuffle(typesList);

            shuffledPhrases.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = item.text;
                card.dataset.id = item.id;
                card.onclick = () => selectPhrase(card, item);
                phrasesCol.appendChild(card);
            });

            typesList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = item.type;
                card.dataset.id = item.id;
                card.dataset.type = item.type;
                card.onclick = () => selectType(card, item);
                typesCol.appendChild(card);
            });
        }

        function selectPhrase(card, data) {
            if (!gameActive || card.classList.contains('matched')) return;
            playSound('click');

            document.querySelectorAll('#phrasesCol .card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedPhrase = { card, data };

            checkMatch();
        }

        function selectType(card, data) {
            if (!gameActive || card.classList.contains('matched')) return;
            playSound('click');

            document.querySelectorAll('#typesCol .card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedType = { card, data };

            checkMatch();
        }

        function checkMatch() {
            if (selectedPhrase && selectedType) {
                if (selectedPhrase.data.id === selectedType.data.id) {
                    playSound('correct');
                    
                    selectedPhrase.card.classList.remove('selected');
                    selectedType.card.classList.remove('selected');
                    
                    selectedPhrase.card.classList.add('matched');
                    selectedType.card.classList.add('matched');

                    score += 10;
                    document.getElementById('score').innerText = score;

                    history.push({
                        phraseCard: selectedPhrase.card,
                        typeCard: selectedType.card,
                        points: 10
                    });
                    document.getElementById('undoBtn').disabled = false;

                    selectedPhrase = null;
                    selectedType = null;

                    if (score === gameData.length * 10) {
                        setTimeout(() => {
                            playSound('win');
                            document.getElementById('winModal').style.display = 'flex';
                        }, 300);
                    }
                } else {
                    playSound('wrong');
                    
                    const pCard = selectedPhrase.card;
                    const tCard = selectedType.card;

                    pCard.style.borderColor = '#ff0055';
                    tCard.style.borderColor = '#ff0055';

                    setTimeout(() => {
                        pCard.classList.remove('selected');
                        tCard.classList.remove('selected');
                        pCard.style.borderColor = '#00f3ff';
                        tCard.style.borderColor = '#00f3ff';
                    }, 500);

                    selectedPhrase = null;
                    selectedType = null;
                }
            }
        }

        function undoMove() {
            if (history.length === 0 || !gameActive) return;
            playSound('click');

            const lastMove = history.pop();
            lastMove.phraseCard.classList.remove('matched');
            lastMove.typeCard.classList.remove('matched');

            score -= lastMove.points;
            document.getElementById('score').innerText = score;

            if (history.length === 0) {
                document.getElementById('undoBtn').disabled = true;
            }
        }

        function restartGame() {
            startGame();
        }

        function closeModal() {
            document.getElementById('winModal').style.display = 'none';
        }

        // Бит әзірленуі
        window.onload = () => {
            renderCards();
        };
    </script>
</body>
</html>
